name: nirengi
description: Bekçi Bilgi Notu saha olay ve resmi bilgi notu uygulaması.
publish_to: none
version: 1.0.0+3

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.9.1
  sizer: ^2.0.15
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.2
  web: ^1.1.1
  cached_network_image: ^3.3.1
  connectivity_plus: ^6.1.4
  dio: ^5.4.0
  fluttertoast: ^8.2.4
  fl_chart: ^0.65.0
  go_router: ^14.6.1
  flutter_riverpod: ^2.5.1
  flutter_local_notifications: ^20.1.0
  pdf: ^3.11.1
  printing: ^5.13.4
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  mobile_scanner: ^6.0.2
  speech_to_text: ^7.0.0
  geolocator: ^13.0.2
  archive: ^3.6.1
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
