name: Bekçi Bilgi Notu iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter packages
        run: flutter pub get

      - name: CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update

      - name: Build unsigned iOS app
        run: |
          set -e
          export CODE_SIGNING_ALLOWED=NO
          export CODE_SIGNING_REQUIRED=NO
          export CODE_SIGN_IDENTITY=""
          flutter build ios --release --no-codesign \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxmd3F4eHNsZnZ4amZvb2J6dHN0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0NjE4MzIsImV4cCI6MjEwNjAzNzgzMn0.YTO9XdYIGxCiZWpBJA-0iZ2DWh6f3j24l68_teHoYac" || true
          rm -rf build/ios/unsigned-derived
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios/unsigned-derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build
          rm -rf build/ios/iphoneos
          mkdir -p build/ios/iphoneos
          cp -R build/ios/unsigned-derived/Build/Products/Release-iphoneos/Runner.app build/ios/iphoneos/Runner.app

      - name: Package IPA
        run: |
          set -e
          rm -rf Payload Bekci-Bilgi-Notu-unsigned.ipa
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -qry Bekci-Bilgi-Notu-unsigned.ipa Payload
          test -s Bekci-Bilgi-Notu-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bekci-Bilgi-Notu-unsigned-IPA
          path: Bekci-Bilgi-Notu-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
